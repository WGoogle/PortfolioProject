<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer's Portfolio</title>
</head>
<body>
    <h1>What Stock do you wish to add?</h1>
    <form action="/addstock" method="POST">
        <label for="ticker">Ticker:</label>
        <input type="text" id="ticker" name="ticker" required><br><br>
        
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" required><br><br>
        
        <label for="price">Purchased Price:</label>
        <input type="number" step="0.01" id="price" name="price" required><br><br>
        
        <label for="purchase_date">Purchase Date:</label>
        <input type="date" id="purchase_date" name="purchase_date" required><br><br>
        
        <button type="submit">Put in Portfolio</button>
    </form>
</body>
</html>
